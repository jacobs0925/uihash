<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mailbox</title>
<style>
  :root { --brand: #0b57d0; --compose: #c2e7ff; --row-read: #f2f6fc; --row-unread: #ffffff; --muted: #5f6368; --line: #e0e3e7; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, sans-serif; font-size: 14px; color: #1f1f1f; background: #f6f8fc; }
  header.top { display: flex; align-items: center; height: 64px; padding: 8px 16px; gap: 12px; position: relative; z-index: 5; }
  .logo { display: flex; align-items: center; gap: 8px; width: 222px; font-size: 22px; color: var(--muted); }
  .logo svg { width: 32px; height: 32px; }
  .search { flex: 1; max-width: 720px; display: flex; align-items: center; background: #e9eef6; border-radius: 24px; height: 48px; padding: 0 16px; gap: 12px; }
  .search input { flex: 1; border: 0; background: transparent; font-size: 16px; outline: none; }
  .search svg { width: 24px; height: 24px; fill: #444746; flex-shrink: 0; }
  .tab svg { width: 20px; height: 20px; fill: currentColor; flex-shrink: 0; }
  .menu .mi svg { width: 20px; height: 20px; fill: #444746; }
  .top-actions { margin-left: auto; display: flex; align-items: center; gap: 4px; }
  .icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; display: inline-flex; align-items: center; justify-content: center; color: #444746; cursor: pointer; padding: 0; }
  .icon-btn svg { width: 20px; height: 20px; fill: currentColor; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; margin-left: 8px; }
  .layout { display: flex; }
  nav.side { width: 256px; padding: 8px 16px 8px 8px; flex-shrink: 0; }
  .compose { display: inline-flex; align-items: center; gap: 12px; height: 56px; padding: 0 24px 0 16px; border-radius: 16px; border: 0; background: var(--compose); font-size: 14px; font-weight: 500; color: #001d35; box-shadow: none; margin: 0 0 16px 0; cursor: pointer; }
  .compose svg { width: 24px; height: 24px; }
  .nav-item { display: flex; align-items: center; height: 32px; padding: 0 12px 0 26px; border-radius: 0 16px 16px 0; color: #202124; gap: 18px; }
  .nav-item svg { width: 20px; height: 20px; fill: #444746; }
  .nav-item.active { background: #d3e3fd; font-weight: 700; }
  .nav-item .count { margin-left: auto; font-size: 12px; font-weight: 700; }
  .labels-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 12px 8px 26px; font-size: 16px; color: #202124; }
  .label-dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  main { flex: 1; background: #fff; border-radius: 16px; margin: 0 16px 16px 0; min-width: 0; }
  .toolbar { display: flex; align-items: center; height: 48px; padding: 0 16px; gap: 8px; border-bottom: 1px solid var(--line); }
  .toolbar .pager { margin-left: auto; color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 8px; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tab { width: 252px; height: 56px; display: flex; align-items: center; gap: 16px; padding: 0 16px; color: var(--muted); font-size: 14px; border-bottom: 3px solid transparent; }
  .tab.active { color: var(--brand); border-bottom-color: var(--brand); }
  .tab .badge { background: #188038; color: #fff; border-radius: 8px; font-size: 11px; padding: 1px 6px; }
  .tip { margin: 8px 16px; padding: 10px 14px; background: #fef7e0; border-radius: 8px; color: #5f370e; font-size: 13px; }
  ul.rows { list-style: none; margin: 0; padding: 0; }
  li.row { display: flex; align-items: center; height: 40px; padding: 0 16px; gap: 8px; border-bottom: 1px solid #f1f3f4; background: var(--row-read); }
  li.row.unread { background: var(--row-unread); }
  li.row.unread .sender, li.row.unread .subject, li.row.unread .date { font-weight: 700; color: #1f1f1f; }
  .row input[type=checkbox] { width: 18px; height: 18px; margin: 0 4px; }
  .star { width: 20px; height: 20px; fill: none; stroke: #444746; stroke-width: 1.6; flex-shrink: 0; }
  .star.on { fill: #f4b400; stroke: #f4b400; }
  .important { width: 18px; height: 18px; fill: #f4b400; flex-shrink: 0; }
  .imp-slot { width: 18px; flex-shrink: 0; display: inline-block; }
  .sender { width: 168px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #444746; }
  .line { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; }
  .subject { color: #444746; }
  .snippet { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  .chip { font-size: 12px; padding: 0 4px; border-radius: 4px; line-height: 18px; flex-shrink: 0; }
  .attach { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #c4c7c5; border-radius: 16px; height: 24px; padding: 0 10px; font-size: 12px; color: #444746; flex-shrink: 0; margin-left: 8px; }
  .attach svg { width: 14px; height: 14px; fill: #d93025; }
  .date { width: 64px; text-align: right; font-size: 12px; color: var(--muted); flex-shrink: 0; }
  footer { display: flex; justify-content: space-between; align-items: center; padding: 16px; color: var(--muted); font-size: 12px; }
  .storage { display: flex; flex-direction: column; gap: 4px; }
  .bar { width: 180px; height: 4px; background: #e3e3e3; border-radius: 2px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--brand); }
  footer a { color: var(--muted); margin: 0 6px; }
  .menu { position: absolute; top: 56px; right: 56px; width: 280px; background: #fff; border-radius: 12px; box-shadow: 0 4px 8px 3px rgba(0,0,0,.15); padding: 8px 0; z-index: 10; }
  .menu .mi { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 16px; }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }
  .composer { position: fixed; right: 24px; bottom: 0; width: 520px; height: 480px; background: #fff; border-radius: 12px 12px 0 0; box-shadow: 0 8px 10px 1px rgba(0,0,0,.14), 0 3px 14px 2px rgba(0,0,0,.12); display: flex; flex-direction: column; z-index: 20; }
  .composer .head { background: #f2f6fc; height: 40px; display: flex; align-items: center; padding: 0 16px; border-radius: 12px 12px 0 0; font-weight: 500; }
  .composer .field { border-bottom: 1px solid var(--line); margin: 0 16px; height: 36px; display: flex; align-items: center; color: var(--muted); }
  .composer .body { flex: 1; margin: 8px 16px; }
  .composer .send { margin: 12px 16px; align-self: flex-start; background: var(--brand); color: #fff; border: 0; border-radius: 18px; height: 36px; padding: 0 24px; font-weight: 500; }
  .empty { padding: 48px; text-align: center; color: var(--muted); }
</style>
<style id="mutation"></style>
</head>
<body>
<div id="app"></div>
<script>
// ---------------------------------------------------------------------------------------------
// Query params: seed (data), n (row count, default random), m (comma list of mutations),
// state (menu|compose|none), now (epoch ms "current time"), tipseed (non-deterministic widget).
// ---------------------------------------------------------------------------------------------
const P = new URLSearchParams(location.search);
const MUT = new Set((P.get('m') || '').split(',').filter(Boolean));
let STATE = P.get('state') || 'none';
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const R = rng(+(P.get('seed') || 1));
const pick = (a) => a[Math.floor(R() * a.length)];
const NOW = +(P.get('now') || Date.UTC(2026, 9, 7, 15, 30));

const FIRST = ['Ana', 'Ben', 'Chloé', 'Dmitri', 'Eve', 'Farah', 'Gus', 'Hiro', 'Ines', 'Jon', 'Kemi', 'Liam', 'Mei', 'Noor', 'Olu', 'Priya', 'Quinn', 'Rosa', 'Sven', 'Tariq'];
const LAST = ['Okafor', 'Smith', 'Nakamura', 'García', 'Ivanova', 'Chen', 'Haddad', 'Novak', 'Rossi', 'Kowalski', 'Bergström', 'Mensah'];
const ORGS = ['GitHub', 'Figma', 'Stripe', 'Linear', 'The Atlantic', 'Booking.com', 'LinkedIn', 'Google Calendar'];
const WORDS = 'quarterly review draft invoice meeting notes design system release candidate offsite budget update action required welcome onboarding feedback roadmap launch checklist migration plan incident report interview schedule receipt order shipped your weekly summary security alert new sign-in'.split(' ');
const LABELS = [['Work', '#fad165'], ['Family', '#b3efd3'], ['Receipts', '#c9daf8'], ['Travel', '#f6c5be'], ['Finance', '#e3d7ff'], ['Later', '#fdedc1']];
const FILES = ['Q3-report.pdf', 'invoice_0423.pdf', 'slides.pptx', 'budget.xlsx', 'photo.jpg', 'contract.docx'];
const AVATAR_COLORS = ['#1a73e8', '#e8710a', '#188038', '#d93025', '#9334e6', '#007b83'];

function sentence(k) { let s = []; for (let i = 0; i < k; i++) s.push(pick(WORDS)); s = s.join(' '); return s[0].toUpperCase() + s.slice(1); }
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function fmtDate(t) {
  const d = new Date(t), n = new Date(NOW);
  if (d.toDateString() === n.toDateString()) { let h = d.getUTCHours(), m = d.getUTCMinutes(); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${String(m).padStart(2, '0')} ${ap}`; }
  return `${MONTHS[d.getUTCMonth()]} ${d.getUTCDate()}`;
}
const n = P.has('n') ? +P.get('n') : 8 + Math.floor(R() * 42);
let t = NOW - Math.floor(R() * 3600e3);
const emails = [];
for (let i = 0; i < n; i++) {
  t -= Math.floor(R() * 9 * 3600e3);
  const org = R() < 0.35;
  emails.push({
    id: Math.floor(R() * 1e9).toString(36),
    sender: org ? pick(ORGS) : `${pick(FIRST)} ${pick(LAST)}`,
    subject: sentence(2 + Math.floor(R() * 6)),
    snippet: sentence(6 + Math.floor(R() * 14)),
    unread: R() < 0.3, starred: R() < 0.15, important: R() < 0.2,
    labels: R() < 0.35 ? [pick(LABELS)].concat(R() < 0.3 ? [pick(LABELS)] : []) : [],
    file: R() < 0.12 ? pick(FILES) : null,
    time: t,
  });
}
// ?newmail=K: K new unread emails arrive at the top; everything else in the inbox is unchanged
for (let k = 0; k < +(P.get('newmail') || 0); k++) {
  emails.unshift({ id: 'new' + k, sender: ['Zoë Achterberg', 'Release Bot', 'Grace Hopper'][k % 3], subject: 'Re: the thing we discussed ' + (k + 1),
    snippet: 'Quick follow-up on yesterday — can you take a look before Friday?', unread: true, starred: k === 1, important: true,
    labels: k % 2 ? [] : [LABELS[3]], file: k === 0 ? 'notes.pdf' : null, time: NOW - (k + 1) * 60e3 });
}
const me = { name: `${pick(FIRST)} ${pick(LAST)}`, color: pick(AVATAR_COLORS) };
const counts = { inbox: Math.floor(R() * 3000), drafts: Math.floor(R() * 12), promo: 1 + Math.floor(R() * 9) };
const storage = { used: Math.round(R() * 150) / 10, total: 15 };
const userLabels = LABELS.filter(() => R() < 0.6);
const lastActivity = 1 + Math.floor(R() * 59);

// Truly non-deterministic widget (not controlled by the data seed): rotates on every load
// unless tipseed is pinned. Mimics A/B copy, "tip of the day", rotating promos.
const TIPS = ['Tip: Press "c" to compose a new message.', 'Did you know? You can snooze emails until later.', 'Try the new reading pane in Settings.'];
const tip = TIPS[P.has('tipseed') ? (+P.get('tipseed')) % 3 : Math.floor(Math.random() * 3)];
const uid = () => 'u' + Math.floor(Math.random() * 1e8).toString(36); // random DOM ids (React useId-style)

// ---------------------------------------------------------------------------------------------
const ICON = {
  menu: 'M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z',
  search: 'M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z',
  help: 'M11 18h2v-2h-2v2zm1-16C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-2.21 0-4 1.79-4 4h2c0-1.1.9-2 2-2s2 .9 2 2c0 2-3 1.75-3 5h2c0-2.25 3-2.5 3-5 0-2.21-1.79-4-4-4z',
  settings: 'M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z',
  settings2: 'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8.94 3A8.99 8.99 0 0 0 13 3.06V1h-2v2.06A8.99 8.99 0 0 0 3.06 11H1v2h2.06A8.99 8.99 0 0 0 11 20.94V23h2v-2.06A8.99 8.99 0 0 0 20.94 13H23v-2h-2.06z',
  apps: 'M6 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6 12c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-6 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0-6c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm4-8c0 1.1.9 2 2 2s2-.9 2-2-.9-2-2-2-2 .9-2 2zm-4 2c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6 6c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 6c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z',
  pencil: 'M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a.996.996 0 0 0 0-1.41l-2.34-2.34a.996.996 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z',
  inbox: 'M19 3H4.99C3.88 3 3 3.9 3 5l.01 14c0 1.1.88 2 1.99 2H19c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 12h-4c0 1.66-1.35 3-3 3s-3-1.34-3-3H4.99V5H19v10z',
  star: 'M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z',
  clock: 'M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z',
  send: 'M2.01 21L23 12 2.01 3 2 10l15 2-15 2z',
  draft: 'M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zM6 20V4h7v5h5v11H6z',
  refresh: 'M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z',
  more: 'M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z',
  left: 'M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z',
  right: 'M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z',
  clip: 'M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5a2.5 2.5 0 0 1 5 0v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5a2.5 2.5 0 0 0 5 0V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z',
  clip2: 'M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6z',
  label: 'M17.63 5.84C17.27 5.33 16.67 5 16 5L5 5.01C3.9 5.01 3 5.9 3 7v10c0 1.1.9 1.99 2 1.99L16 19c.67 0 1.27-.33 1.63-.84L22 12l-4.37-6.16z',
  imp: 'M2 6l7 6-7 6h13l7-6-7-6z',
};
const svg = (name, cls = '') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICON[name]}"></path></svg>`;
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const avatarUri = (name, color) => 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><rect width="64" height="64" fill="${color}"/><text x="32" y="42" font-size="28" text-anchor="middle" fill="#fff" font-family="Arial">${name.split(' ').map((w) => w[0]).join('')}</text></svg>`);

const C = MUT.has('class-rename') ? (c) => 'x-' + c : (c) => c; // refactor: rename every class consistently
function row(e) {
  const chips = e.labels.map(([l, col]) => `<span class="${C('chip')}" style="background:${col}">${esc(l)}</span>`).join('');
  const attach = e.file ? `<span class="${C('attach')}">${svg(MUT.has('attach-icon') ? 'clip2' : 'clip')}${esc(e.file)}</span>` : '';
  let inner = `
    <input type="checkbox" aria-label="Select">
    <svg class="${C('star')} ${e.starred ? C('on') : ''}" viewBox="0 0 24 24" aria-label="${e.starred ? 'Starred' : 'Not starred'}"><path d="${ICON.star}"></path></svg>
    ${e.important ? `<svg class="${C('important')}" viewBox="0 0 24 24" aria-label="Important"><path d="${ICON.imp}"></path></svg>` : `<span class="${C('imp-slot')}"></span>`}
    <span class="${C('sender')}">${MUT.has('bind-undefined') && e.unread ? 'undefined' : MUT.has('bind-empty') && e.unread ? '' : esc(e.sender)}</span>
    <span class="${C('line')}">${chips}<span class="${C('subject')}">${MUT.has('bind-template') && e.starred ? '{{ email.subject }}' : esc(e.subject)}</span><span class="${C('snippet')}">&nbsp;- ${esc(e.snippet)}</span>${attach}</span>
    <span class="${C('date')}" title="${new Date(e.time).toUTCString()}">${fmtDate(e.time)}</span>`;
  if (MUT.has('wrapper-div')) inner = `<div style="display:contents">${inner}</div>`; // refactor: no-op wrapper
  return `<li class="${C('row')} ${e.unread ? C('unread') : ''}" id="${uid()}" data-mid="${e.id}">${inner}</li>`;
}
const navItems = [['inbox', 'Inbox', MUT.has('bind-nan') ? 'NaN' : counts.inbox.toLocaleString('en-US')], ['star', 'Starred', ''], ['clock', 'Snoozed', ''], ['send', 'Sent', ''], ['draft', 'Drafts', counts.drafts || '']];
const toolbarBtns = MUT.has('toolbar-order') ? ['more', 'refresh'] : ['refresh', 'more'];
const from = 1, to = Math.min(50, emails.length), total = counts.inbox + emails.length;
const pagerText = MUT.has('pager-text') ? `${from}–${to} from ${total.toLocaleString('en-US')}` : `${from}–${to} of ${total.toLocaleString('en-US')}`;

function render() {
document.getElementById('app').innerHTML = `
<header class="${C('top')}">
  <button class="${C('icon-btn')}" aria-label="Main menu">${svg('menu')}</button>
  <div class="${C('logo')}">${svg('inbox')}<span>Mailbox</span></div>
  <div class="${C('search')}">${svg('search', C('s-ico'))}<input placeholder="Search mail" aria-label="Search mail"></div>
  <div class="${C('top-actions')}">
    <button class="${C('icon-btn')}" aria-label="Support">${svg('help')}</button>
    <button class="${C('icon-btn')}" aria-label="Settings">${svg(MUT.has('icon-swap') ? 'settings2' : 'settings')}</button>
    <button class="${C('icon-btn')}" aria-label="Apps">${svg('apps')}</button>
    <img class="${C('avatar')}" alt="Account: ${esc(me.name)}" src="${avatarUri(me.name, me.color)}">
  </div>
  ${STATE === 'menu' ? `<div class="${C('menu')}" role="menu"><div class="${C('mi')}">${svg('settings')}See all settings</div><div class="${C('mi')}">${svg('apps')}Density</div><hr><div class="${C('mi')}">${svg('label')}Theme</div><div class="${C('mi')}">${svg('inbox')}Inbox type</div></div>` : ''}
</header>
<div class="${C('layout')}">
  <nav class="${C('side')}">
    <button class="${C('compose')}">${svg('pencil')}${MUT.has('typo') ? 'Compse' : 'Compose'}</button>
    ${navItems.map(([ic, name, c], i) => `<div class="${C('nav-item')} ${i === 0 ? C('active') : ''}">${svg(ic)}<span>${name}</span>${c !== '' ? `<span class="${C('count')}">${c}</span>` : ''}</div>`).join('')}
    <div class="${C('labels-head')}"><span>Labels</span><button class="${C('icon-btn')}" aria-label="Create label">+</button></div>
    ${userLabels.map(([l, col]) => `<div class="${C('nav-item')}"><span class="${C('label-dot')}" style="background:${col}"></span><span>${l}</span></div>`).join('')}
  </nav>
  <main>
    <div class="${C('toolbar')}">
      <input type="checkbox" aria-label="Select all">
      ${toolbarBtns.map((b) => `<button class="${C('icon-btn')}" aria-label="${b}">${svg(b)}</button>`).join('')}
      <div class="${C('pager')}"><span>${pagerText}</span><button class="${C('icon-btn')}" aria-label="Newer">${svg('left')}</button><button class="${C('icon-btn')}" aria-label="Older">${svg('right')}</button></div>
    </div>
    <div class="${C('tabs')}" role="tablist">
      <div class="${C('tab')} ${C('active')}" role="tab">${svg('inbox')}Primary</div>
      <div class="${C('tab')}" role="tab">${svg('label')}Promotions <span class="${C('badge')}">${counts.promo} new</span></div>
      <div class="${C('tab')}" role="tab">${svg('apps')}Social</div>
    </div>
    <div class="${C('tip')}" id="${uid()}">${tip}</div>
    ${emails.length ? `<ul class="${C('rows')}">${emails.map(row).join('')}</ul>` : `<div class="${C('empty')}">Your Primary tab is empty.</div>`}
  </main>
</div>
<footer>
  <div class="${C('storage')}"><div class="${C('bar')}"><div style="width:${Math.round(100 * storage.used / storage.total)}%"></div></div><span>${storage.used} GB of ${storage.total} GB used</span></div>
  <div><a href="#">Terms</a>·<a href="#">Privacy</a>·<a href="#">Program Policies</a></div>
  <div>Last account activity: ${lastActivity} minutes ago</div>
</footer>
${STATE === 'compose' ? `<div class="${C('composer')}" role="dialog"><div class="${C('head')}">New Message</div><div class="${C('field')}">To</div><div class="${C('field')}">Subject</div><div class="${C('body')}"></div><button class="${C('send')}">Send</button></div>` : ''}
`;

}
render();
// interactive states: the settings button toggles the menu, Compose opens the composer
document.addEventListener('click', (e) => {
  if (e.target.closest('[aria-label="Settings"]')) { STATE = STATE === 'menu' ? 'none' : 'menu'; render(); }
  else if (e.target.closest('button') && /Comp/.test(e.target.closest('button').textContent)) { STATE = 'compose'; render(); }
});

// ---- mutations: CSS-level regressions (and CSS-only refactors) ------------------------------
const CSS_MUT = {
  'compose-color': `.compose{background:#c2e8ff}`,               // 1-unit hue shift on the primary CTA
  'row-padding': `li.row{padding:0 14px}`,
  'unread-weight': `li.row.unread .sender, li.row.unread .subject, li.row.unread .date{font-weight:600}`,
  'chip-radius': `.chip{border-radius:6px}`,
  'sidebar-width': `nav.side{width:250px}`,
  'hide-star': `.star{display:none}`,
  'date-align': `.date{text-align:left}`,
  'font-family': `body{font-family:Helvetica, Arial, sans-serif}`, // may render identically if Helvetica is absent
  'snippet-color': `.snippet{color:#5f6367}`,                     // invisible to humans, still a change
  'unread-bg': `li.row.unread{background:#fffffe}`,
  'row-height': `li.row{height:42px}`,
  'toolbar-border': `.toolbar{border-bottom:0}`,
  'chip-gap': `.line{gap:8px}`,
  'bar-color': `.bar > div{background:#1a73e8}`,
  'menu-under': `header.top{z-index:auto}`,                       // only visible when the menu is open... maybe
  'hover-bg': `li.row:hover{background:#eef}`,                     // invisible in a static render
  'tab-badge': `.tab .badge{border-radius:4px}`,
  'composer-width': `.composer{width:540px}`,                      // only visible in the compose state
  'shorthand-refactor': `li.row{padding-top:0;padding-right:16px;padding-bottom:0;padding-left:16px}`, // refactor: same computed style
};
document.getElementById('mutation').textContent = [...MUT].map((m) => CSS_MUT[m] || '').join('\n')
  .replace(/(^|\})\s*([^{}]+)\{/g, (all, b, sel) => b + (MUT.has('class-rename') ? sel.replace(/\.([a-z][\w-]*)/g, '.x-$1') : sel) + '{')
  + '\n' + (P.get('css') || '');                                   // ?css=<raw css>: any other change (experiments/subtle)
if (MUT.has('class-rename')) { // rename classes in the base stylesheet too
  const st = document.querySelector('style');
  st.textContent = st.textContent.replace(/\.([a-z][\w-]*)(?=[\s{,.:>\[)]|$)/g, (all, c) => /^\d/.test(c) ? all : '.x-' + c);
}
if (P.get('js')) new Function(P.get('js'))();                   // ?js=<raw js>: DOM changes (experiments/subtle)
</script>
</body>
</html>
