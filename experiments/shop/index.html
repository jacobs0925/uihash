<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shop testbed</title>
<style>
:root { --brand: #0f766e; --brand-ink: #ffffff; --ink: #111827; --muted: #6b7280; --line: #e5e7eb; --sale: #dc2626; --new: #2563eb; --bg: #f9fafb; }
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
.top { display: flex; align-items: center; gap: 16px; height: 60px; padding: 0 24px; background: #ffffff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
.logo { font-weight: 800; font-size: 20px; color: var(--brand); letter-spacing: -0.02em; }
.search { flex: 1; max-width: 480px; height: 38px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; }
.cart { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; background: #ffffff; font-size: 14px; cursor: pointer; }
.cart .badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--brand); color: var(--brand-ink); font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
.sort-btn { height: 38px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: #ffffff; font-size: 14px; cursor: pointer; }
.layout { display: grid; grid-template-columns: 220px 1fr; gap: 24px; padding: 24px; }
.filters { background: #ffffff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; align-self: start; }
.filters h3 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.filters label { display: flex; align-items: center; gap: 8px; font-size: 14px; padding: 5px 0; }
.filters .count { margin-left: auto; color: var(--muted); font-size: 12px; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.card { background: #ffffff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
.card:hover { box-shadow: 0 6px 18px rgba(17, 24, 39, 0.08); border-color: #d1d5db; }
.thumb { width: 100%; height: 140px; object-fit: contain; background: #f3f4f6; display: block; }
.body { padding: 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.title { font-size: 14px; font-weight: 600; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.stars { color: #f59e0b; letter-spacing: 1px; }
.price { font-size: 16px; font-weight: 700; }
.price .was { margin-left: 6px; font-size: 12px; font-weight: 400; color: var(--muted); text-decoration: line-through; }
.tag { position: absolute; top: 10px; left: 10px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; color: #ffffff; }
.tag.sale { background: var(--sale); }
.tag.new { background: var(--new); }
.media { position: relative; }
.add { margin-top: auto; height: 34px; border: 0; border-radius: 8px; background: var(--brand); color: var(--brand-ink); font-size: 14px; font-weight: 600; cursor: pointer; }
.add:hover { background: #115e59; }
.add:focus-visible, .cart:focus-visible, .sort-btn:focus-visible { outline: 2px solid var(--new); outline-offset: 2px; }
.add.in-cart { background: #e6f4f1; color: var(--brand); }
.pager { display: flex; justify-content: center; gap: 6px; margin-top: 20px; }
.pager button { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 8px; background: #ffffff; font-size: 13px; cursor: pointer; }
.pager button.current { background: var(--ink); color: #ffffff; border-color: var(--ink); }
.menu { position: absolute; top: 46px; right: 24px; width: 200px; background: #ffffff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12); padding: 6px; display: none; z-index: 20; }
.menu.open { display: block; }
.menu button { display: block; width: 100%; text-align: left; padding: 8px 10px; border: 0; background: none; font-size: 14px; border-radius: 6px; cursor: pointer; }
.menu button:hover { background: #f3f4f6; }
.footer { padding: 24px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); }
</style>
<style id="mutation"></style>
</head>
<body>
<div id="app"></div>
<script>
const P = new URLSearchParams(location.search), seed = +(P.get('seed') || 1);
let s = seed * 9301 + 49297; const R = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
const pick = (a) => a[Math.floor(R() * a.length)];
const NAMES = ['Ceramic mug', 'Linen napkins', 'Oak cutting board', 'Steel water bottle', 'Wool throw', 'Desk lamp', 'Notebook set', 'Canvas tote', 'Glass vase', 'Cotton apron', 'Copper kettle', 'Bamboo tray', 'Herb planter', 'Scented candle', 'Picture frame', 'Wall clock'];
const CATS = ['Kitchen', 'Home', 'Office', 'Garden', 'Gifts'];
const COLORS = ['#fca5a5', '#fcd34d', '#86efac', '#93c5fd', '#c4b5fd', '#f9a8d4', '#a5f3fc'];
function thumb(color) {
  const c = document.createElement('canvas'); c.width = 240; c.height = 140; const g = c.getContext('2d');
  g.fillStyle = '#f3f4f6'; g.fillRect(0, 0, 240, 140); g.fillStyle = color; g.beginPath(); g.arc(120, 70, 44, 0, Math.PI * 2); g.fill();
  g.fillStyle = 'rgba(0,0,0,0.08)'; g.fillRect(60, 110, 120, 8); return c.toDataURL('image/png');
}
const n = 6 + Math.floor(R() * 7), cart = Math.floor(R() * 5);
const items = Array.from({ length: n }, () => {
  const price = 8 + Math.floor(R() * 90) + (R() < 0.5 ? 0.99 : 0.49), sale = R() < 0.3, isNew = !sale && R() < 0.25;
  return { name: pick(NAMES), price, was: sale ? price + 5 + Math.floor(R() * 20) : 0, sale, isNew, rating: 3 + Math.floor(R() * 3), reviews: Math.floor(R() * 400), color: pick(COLORS), inCart: R() < 0.2 };
});
const counts = CATS.map(() => 2 + Math.floor(R() * 30));
const money = (v) => '$' + v.toFixed(2);
document.getElementById('app').innerHTML = `
<header class="top">
  <span class="logo">Acme Store</span>
  <input class="search" placeholder="Search products">
  <button class="sort-btn" aria-label="Sort">Sort</button>
  <button class="cart" aria-label="Cart">Cart <span class="badge">${cart}</span></button>
  <div class="menu"><button>Featured</button><button>Price: low to high</button><button>Price: high to low</button><button>Newest</button></div>
</header>
<div class="layout">
  <aside class="filters"><h3>Category</h3>${CATS.map((c, i) => `<label><input type="checkbox"${i === 0 ? ' checked' : ''}> ${c}<span class="count">${counts[i]}</span></label>`).join('')}
    <h3 style="margin-top:16px">Price</h3><label><input type="radio" name="p" checked> Any</label><label><input type="radio" name="p"> Under $25</label><label><input type="radio" name="p"> $25 to $50</label></aside>
  <main>
    <div class="grid">${items.map((it) => `<article class="card"><div class="media"><img class="thumb" alt="${it.name}" src="${thumb(it.color)}">${it.sale ? '<span class="tag sale">Sale</span>' : it.isNew ? '<span class="tag new">New</span>' : ''}</div>
      <div class="body"><div class="title">${it.name}</div><div class="meta"><span class="stars">${'★'.repeat(it.rating)}${'☆'.repeat(5 - it.rating)}</span><span>${it.reviews} reviews</span></div>
      <div class="price">${money(it.price)}${it.sale ? `<span class="was">${money(it.was)}</span>` : ''}</div>
      <button class="add${it.inCart ? ' in-cart' : ''}">${it.inCart ? 'In cart' : 'Add to cart'}</button></div></article>`).join('')}</div>
    <nav class="pager"><button class="current">1</button><button>2</button><button>3</button><button aria-label="Next page">›</button></nav>
  </main>
</div>
<footer class="footer">Free returns within 30 days · Prices include tax</footer>`;
document.querySelector('.sort-btn').addEventListener('click', () => document.querySelector('.menu').classList.toggle('open'));
document.getElementById('mutation').textContent = P.get('css') || '';
if (P.get('js')) new Function(P.get('js'))();
</script>
</body>
</html>
